[project]
name = "avito-ds-bootcamp"
version = "0.1.0"
description = "Candidate generation for Avito services search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pystemmer>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
eda = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "polars>=1.44.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "candgen"

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
